<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self'; script-src 'self'"><title>鲸鱼娘精简版</title>
<style>*{box-sizing:border-box}body{margin:0;background:transparent;overflow:hidden;font-family:'Microsoft YaHei',sans-serif;user-select:none}#bubble{position:absolute;left:12%;width:76%;bottom:calc(56.25vw + 6px);min-height:calc(56.25vw * 0.315);display:var(--bubble-display,block);overflow:visible;padding:clamp(8px,calc(14px * var(--zoom,1)),16px) clamp(10px,calc(18px * var(--zoom,1)),20px);border:none;border-radius:16px;background:#ffffff;color:#1f1f1f;font-size:clamp(8px,calc(38px * var(--zoom,1)),40px);line-height:1.4;box-shadow:0 5px 16px rgba(0,0,0,.20);z-index:2;opacity:0;transition:opacity .18s;word-break:break-word}#bubbleText{max-height:calc(100vh - 56.25vw - 30px);overflow-y:auto;scrollbar-width:none;}#bubbleText::-webkit-scrollbar{display:none}#bubble:after{content:'';position:absolute;bottom:-11px;left:50%;display:var(--bubble-arrow,block);border-left:10px solid transparent;border-right:10px solid transparent;border-top:12px solid #ffffff;transform:translateX(-50%)}video{position:absolute;left:0;bottom:0;width:100vw;height:56.25vw;object-fit:contain;pointer-events:none}#drag{position:absolute;left:30%;bottom:3.375vw;width:40%;height:48.375vw;clip-path:ellipse(50% 50% at 50% 50%);cursor:grab}</style>
<div id="bubble"><div id="bubbleText"></div></div><video id="video" muted autoplay playsinline></video><div id="drag" title="拖动位置 · 右键菜单"></div><script src="renderer.js"></script></html>
